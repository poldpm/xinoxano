<!doctype html>
<html lang="ca" data-mode="fitxes">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Xino-Xano · Fitxes per imprimir</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="icon" type="image/svg+xml" href="assets/icona-petita.svg">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#810023">
<link rel="apple-touch-icon" href="assets/icona-192.png">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
/* Concepte: un quadern de quadrícula (clar) que de nit es torna pissarra (fosc).
   Barra superior fixa + una sola columna de treball. Alumnes: botons grans i poca lletra. */
:root{
  /* Identitat Vedruna Escorial Vic: vermell #E0003F i granat #810023 del logo, negre del text.
     Fira Sans per a la interfície (propera a la lletra del logo); Andika als exercicis, pensada per a lectors que comencen. */
  --brand:#E0003F; --brand2:#810023; --brand-soft:#fde8ee;
  --paper:#f7f4f5; --grid:rgba(129,0,35,.045); --card:#ffffff; --ink:#1c1619; --soft:#6a5d62; --line:#e6dde0;
  --blue:#810023; --blue-ink:#ffffff; --hi:#E0003F; --hi-ink:#ffffff;
  --ok:#17844f; --ok-bg:#e1f5ea; --warn:#b85410; --warn-bg:#fdefe3; --bad:#b3261e; --bad-bg:#fbe6e4;
  --cat:#E0003F; --mat:#2a55c9; --chip:#f3edef; --shadow:0 3px 0 rgba(129,0,35,.10);
  --f-display:'Fira Sans','Segoe UI',system-ui,sans-serif;
  --f-body:'Fira Sans','Segoe UI',system-ui,sans-serif;
  --f-read:'Andika','Trebuchet MS',system-ui,sans-serif;
  --f-num:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  color-scheme:light;
}
.logo-d{display:none}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background-color:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.9rem;font-weight:700} h2{font-size:1.45rem;font-weight:700} h3{font-size:1.1rem;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* barra superior */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:2px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:12px;font-family:var(--f-display);font-weight:700;font-size:1.2rem}
.brand img{height:34px;width:auto}
.brand .app{padding-left:12px;border-left:2px solid var(--line);color:var(--brand2);display:flex;align-items:center;gap:8px}
.brand .app .appicon{height:30px;width:30px}
.tick{display:inline-block;vertical-align:-4px}
.brand .dot{width:28px;height:28px;border-radius:50%;background:var(--hi);display:grid;place-items:center;color:var(--hi-ink);font-size:.95rem}
.proto{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);font-weight:700}
.seg{display:flex;background:var(--chip);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:700;color:var(--soft)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.spacer{flex:1}

main{max-width:1080px;margin:0 auto;padding-block:22px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stack{display:flex;flex-direction:column;gap:18px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.muted{color:var(--soft)}
.small{font-size:.85rem}
.note{font-size:.82rem;color:var(--soft);border-left:3px solid var(--hi);padding:4px 0 4px 10px}

.btn{border:0;border-radius:14px;padding:10px 18px;font-weight:700;cursor:pointer;background:var(--blue);color:var(--blue-ink);box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--chip);color:var(--ink);box-shadow:none}
.btn.hi{background:var(--hi);color:var(--hi-ink)}
.btn.danger{background:var(--bad-bg);color:var(--bad);box-shadow:none}
.btn.big{font-size:1.25rem;padding:14px 26px;border-radius:18px}
.link{background:none;border:0;color:var(--blue);cursor:pointer;font-weight:700;padding:0;text-decoration:underline}

.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}

.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--chip);font-size:.8rem;font-weight:700;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.cat{color:var(--cat)} .chip.mat{color:var(--mat)}
.kpi{display:flex;flex-direction:column;gap:4px}
.kpi b{font-family:var(--f-display);font-size:2rem;line-height:1}
.kpi span{font-size:.82rem;color:var(--soft)}

/* taules */
.tw{overflow-x:auto;border:2px solid var(--line);border-radius:16px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);font-weight:700}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--chip)}
.spark{display:flex;align-items:flex-end;gap:2px;height:24px}
.spark i{display:block;width:7px;border-radius:2px;background:var(--blue);min-height:2px}
.spark i.z{background:var(--line)}

/* barres */
.bar{height:12px;background:var(--chip);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--blue)}
.bar.bad i{background:var(--bad)} .bar.warn i{background:var(--warn)} .bar.ok i{background:var(--ok)}

/* tabs docent */
.tabs{display:flex;flex-wrap:wrap;gap:6px;border-bottom:2px solid var(--line);padding-bottom:0}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:700;color:var(--soft);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--blue)}

label.f{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:.9rem}
input[type=text],input[type=date],input[type=number],select,textarea{border:2px solid var(--line);border-radius:12px;padding:9px 12px;background:var(--card);min-width:0}
textarea{width:100%;min-height:170px;font-family:var(--f-num);font-size:.9rem;line-height:1.5}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;gap:6px;align-items:center;background:var(--chip);padding:6px 10px;border-radius:10px;cursor:pointer;font-size:.9rem}
.stepper{display:inline-flex;align-items:center;gap:4px}
.stepper button{width:32px;height:32px;border-radius:10px;border:0;background:var(--chip);font-weight:700;cursor:pointer}
.stepper b{min-width:24px;text-align:center}
.skrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.skrow:last-child{border-bottom:0}

/* alumnes: entrada */
.classes{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.classbtn{border:0;border-radius:22px;padding:22px 10px;font-family:var(--f-display);font-size:1.8rem;font-weight:700;cursor:pointer;color:#1c1619;box-shadow:var(--shadow)}
.names{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.namebtn{border:2px solid var(--line);background:var(--card);border-radius:20px;padding:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:1.05rem}

/* alumnes: inici */
.hero-st{display:flex;flex-wrap:wrap;gap:20px;align-items:center}
.hero-st .who{flex:1;min-width:220px;display:flex;flex-direction:column;gap:8px}
.xp{display:flex;align-items:center;gap:10px}
.xp .bar{flex:1;height:14px}
.xp .bar i{background:linear-gradient(90deg,var(--brand),var(--brand2))}
.coins{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-family:var(--f-display);font-size:1.2rem}
.coin{width:22px;height:22px;border-radius:50%;background:#f2c230;border:3px solid #d29b0c;display:inline-block}
.tiles{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.tile{border:0;border-radius:22px;padding:18px;text-align:left;cursor:pointer;background:var(--card);border:2px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-height:130px}
.tile:disabled{opacity:.6;cursor:default}
.tile .chip{align-self:flex-start}
.tile .ic{font-size:2rem;line-height:1;height:54px}
.tile .ic svg{display:block}
.tile:disabled .ic{filter:grayscale(1);opacity:.6}
.tile b{font-family:var(--f-display);font-size:1.3rem}
.tile .badge{align-self:flex-start;background:var(--hi);color:var(--hi-ink);border-radius:999px;padding:2px 10px;font-weight:700}
.tasklist{display:flex;flex-direction:column;gap:10px}
.taskitem{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px}
.taskitem .t{flex:1;min-width:180px}
.stars{color:#e0a400;letter-spacing:2px;font-size:1.2rem}

/* exercici */
.play{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.play-top{display:flex;gap:12px;align-items:center}
.pbar{flex:1;height:16px;background:var(--chip);border-radius:999px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .3s}
.ex,.ex h2,.opt,.tok,.ans-in,.namebtn{font-family:var(--f-read)}
.ex{background:var(--card);border:2px solid var(--line);border-radius:26px;padding:22px;display:flex;flex-direction:column;gap:18px;box-shadow:var(--shadow)}
.ex.mat-cat{border-top:8px solid var(--cat)} .ex.mat-mat{border-top:8px solid var(--mat)}
.ex.pal .prompt h2,.ex.pal .opt,.ex.pal .tok,.ex.pal .visual .word,.ex.pal .ans-in,.ex.pal .readtext{text-transform:uppercase}
.prompt{display:flex;gap:12px;align-items:flex-start}
.prompt h2{font-size:1.6rem;padding-top:6px}
.spk{flex:none;width:54px;height:54px;border-radius:50%;border:0;background:var(--hi);color:var(--hi-ink);cursor:pointer;display:grid;place-items:center;box-shadow:var(--shadow)}
.spk svg{width:28px;height:28px}
.visual{display:flex;justify-content:center;flex-wrap:wrap;gap:10px}
.emojis{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;font-size:2.4rem;max-width:520px}
.bigemoji{font-size:4.5rem;line-height:1}
.word{font-family:var(--f-read);font-size:2.6rem;font-weight:700;letter-spacing:.04em}
.word .gap{display:inline-block;min-width:1.3em;border-bottom:5px solid var(--brand);margin:0 3px;text-align:center;color:var(--brand)}
.colop{font-family:var(--f-num);font-size:2.2rem;font-weight:700;display:inline-block;padding:10px 16px;border-radius:14px;background:var(--chip)}
.colg{border-collapse:collapse;margin:0 auto;width:auto;min-width:0;table-layout:fixed}
.colg td{width:1.05em;min-width:1.05em;max-width:1.05em;height:1.3em;text-align:center;vertical-align:middle;padding:0;line-height:1;white-space:nowrap}
.colg td{border:none}
.colg td.cm{width:.4em;min-width:.4em;max-width:.4em}
.colg td.op{width:1em;text-align:center}
.colg tr.l2 td:not(.op){border-bottom:4px solid var(--ink)}
.colg tr.cr,.colg tr.ans{display:none}
.series{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.series span{min-width:64px;padding:10px;border-radius:14px;background:var(--chip);font-family:var(--f-num);font-size:1.7rem;font-weight:700;text-align:center}
.series span.q{background:var(--hi);color:var(--hi-ink)}
.readtext{background:var(--chip);border-radius:16px;padding:16px 18px;font-size:1.2rem;line-height:1.6;max-width:62ch}
.rapidclock{width:96px;height:96px;border-radius:50%;border:6px solid var(--brand);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:2rem;color:var(--brand2)}
.rapidclock.small{width:56px;height:56px;border-width:4px;font-size:1.2rem}
.stickbtn{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:4px;cursor:pointer;line-height:0}.stickbtn[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.festatile{flex-direction:row;align-items:center;gap:16px;min-height:0;border-color:#f0b98f;background:linear-gradient(120deg,#fff7ef,#fdeee2)}.festatile b{font-size:1.4rem}
.howto{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:14px;background:var(--brand-soft);border-left:4px solid var(--brand)}
.listen{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px;border-radius:18px;background:var(--chip);width:100%}
.clock{width:200px;height:200px;max-width:100%}
.opts{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.opt{border:3px solid var(--line);background:var(--card);border-radius:18px;padding:16px;font-size:1.5rem;font-weight:700;cursor:pointer;min-height:72px;box-shadow:var(--shadow)}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.opt.bad{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.opt:disabled{cursor:default}
.ansrow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.ans-in{font-size:2rem;padding:12px 16px;border-radius:16px;border:3px solid var(--line);width:min(100%,320px);text-align:center;background:var(--card);font-weight:700}
.ans-in.ok{border-color:var(--ok);background:var(--ok-bg)} .ans-in.bad{border-color:var(--warn);background:var(--warn-bg)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px 22px}
.match .col{display:flex;flex-direction:column;gap:10px}
.tok{border:3px solid var(--line);background:var(--card);border-radius:16px;padding:12px;font-size:1.35rem;font-weight:700;cursor:pointer;min-height:58px;box-shadow:var(--shadow)}
.tok .hl{color:var(--brand);text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px;font-weight:700}
.tok.sel{border-color:var(--blue);background:var(--chip)}
.tok.bad{border-color:var(--warn);background:var(--warn-bg)}
.tok.ok{border-color:var(--ok);background:var(--ok-bg)}
.tok[data-p]{border-style:solid}
.p0{border-color:#4f7cff!important}.p1{border-color:#f08a24!important}.p2{border-color:#9b6bff!important}.p3{border-color:#e0457f!important}.p4{border-color:#18a37a!important}.p5{border-color:#c99a10!important}
.tok .pn{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--chip);font-size:.8rem;margin-right:6px}
.pool,.slots{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:70px;padding:12px;border-radius:18px}
.slots{border:3px dashed var(--line);background:var(--paper)}
.slots.over,.bucket.over{border-color:var(--blue)}
.buckets{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
.bucket{border:3px dashed var(--line);border-radius:18px;padding:10px;min-height:130px;display:flex;flex-direction:column;gap:8px;cursor:pointer;background:var(--paper)}
.bucket h3{text-align:center;font-size:1.25rem}
.bucket .in{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.fb{display:flex;align-items:center;gap:16px;flex-wrap:wrap;border-radius:22px;padding:14px 18px;border:3px solid}
.fb.ok{background:var(--ok-bg);border-color:var(--ok)}
.fb.retry{background:var(--warn-bg);border-color:var(--warn)}
.fb.reveal{background:var(--chip);border-color:var(--line)}
.fb .msg{flex:1;min-width:200px;display:flex;flex-direction:column;gap:4px}
.fb .msg b{font-family:var(--f-display);font-size:1.4rem}
.play.dis .ex,.play.dis .ex h2,.play.dis .opt,.play.dis .tok,.play.dis .ans-in,.play.dis .word,.play.dis .readtext{font-family:'Lexend',var(--f-read);letter-spacing:.04em;word-spacing:.14em}
.play.dis .readtext{line-height:1.9;max-width:52ch}
.play.gran .prompt h2{font-size:2rem}.play.gran .opt{font-size:1.9rem}.play.gran .tok{font-size:1.6rem}

/* mascota */
.mascot{display:block;flex:none}
.shop{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.shop button{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:center;font-weight:700}
.shop button[aria-pressed="true"]{border-color:var(--blue);background:var(--chip)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.pcats{display:flex;gap:6px;flex-wrap:wrap}
.pcats button{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:700;cursor:pointer;font-size:.95rem}
.pcats button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand);color:#fff}
.pitems{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}
.pitem{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:8px 6px;cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:center;font-weight:700;font-size:.92rem;text-align:center;line-height:1.2}
.pitem[aria-pressed="true"]{border-color:var(--brand);background:var(--chip)}
.pitem.lock{opacity:.55}
.pitem .small{font-weight:400}
.evobar{height:14px}
.album{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
.album .ev{border:2px solid var(--line);border-radius:16px;padding:6px;text-align:center;font-size:.85rem;font-weight:700;background:var(--card)}
.album .ev.now{border-color:var(--brand);background:var(--chip)}
.album .ev .sil{filter:brightness(0);opacity:.16}
.evo-ov{position:fixed;inset:0;background:rgba(20,24,40,.55);display:grid;place-items:center;z-index:60;padding:16px;overflow:auto}
.evo-card{max-width:540px;width:100%;text-align:center;align-items:center;gap:10px}
.evo-row{justify-content:center;align-items:center;gap:6px;flex-wrap:nowrap}
.evo-new{border-radius:50%;background:radial-gradient(circle,#fff6c4 0%,#ffe08a 45%,rgba(255,224,138,0) 70%)}
.evo-old{opacity:.8}
.swatch{width:44px;height:44px;border-radius:50%;border:4px solid var(--card);box-shadow:0 0 0 2px var(--line);cursor:pointer}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 3px var(--blue)}

.grtile{flex-direction:row;align-items:center;gap:16px;min-height:0;background:linear-gradient(120deg,var(--brand),var(--brand2));color:#fff;border-color:transparent}
.grtile .ic{font-size:2.6rem}.grtile b{font-size:1.5rem}.grtile .badge{align-self:center;background:#fff;color:var(--brand2)}
.map{position:relative;width:100%;max-width:820px;margin:0 auto;aspect-ratio:600/420;border-radius:24px;overflow:hidden;border:2px solid var(--line)}
.map > svg{position:absolute;inset:0;width:100%;height:100%}
.map .mapname{background:rgba(255,255,255,.85);padding:4px 12px;border-radius:999px}
.map .mapname{position:absolute;left:14px;bottom:10px;font-weight:700;font-size:clamp(.9rem,2.4vw,1.3rem)}
.node{position:absolute;transform:translate(-50%,-50%);width:clamp(40px,8vw,58px);height:clamp(40px,8vw,58px);border-radius:50%;border:3px solid #fff;background:#fff;color:var(--wc);font-weight:700;font-size:clamp(.8rem,2vw,1.1rem);cursor:pointer;box-shadow:0 0 0 3px var(--wc),0 5px 0 3px rgba(0,0,0,.18);display:grid;place-items:center;padding:0;line-height:1}

function tria(r, correct, distract){
  const set = [String(correct)];
  for (const d of distract) { const s = String(d); if (!set.includes(s) && set.length < 4) set.push(s); }
  const options = shuffle(r, set);
  return {type:'tria', options, answer: options.indexOf(String(correct))};
}
function numTria(r, n, near){ const c = []; for (const d of near) if (d >= 0 && d !== n) c.push(d); while (c.length < 8) c.push(Math.abs(n + ri(r,-5,5))); return tria(r, n, c); }
function gapWord(w){ const m = w.match(/^(.*)\[(.+)\](.*)$/); return {full: m[1] + m[2] + m[3], before: m[1], ans: m[2], after: m[3]}; }
function hasCarry(a,b){ while (a || b) { if (a % 10 + b % 10 >= 10) return true; a = Math.floor(a / 10); b = Math.floor(b / 10); } return false; }
function hasBorrow(a,b){ while (b) { if (a % 10 < b % 10) return true; a = Math.floor(a / 10); b = Math.floor(b / 10); } return false; }
// Operació en columna: cada xifra a la seva casella, unitats sota unitats i comes alineades.
// A la pantalla es veuen les dues files; en paper hi ha a més la fila per a les que es porten i la fila del resultat.
function colop(a, op, b){
  const parts = v => { const [i, d = ''] = String(v).replace(/\./g, '').split(','); return [i, d]; };
  const num = v => parseFloat(String(v).replace(/\./g, '').replace(',', '.'));
  const [ia, da] = parts(a), [ib, db] = parts(b), res = op === '+' ? num(a) + num(b) : num(a) - num(b);
  const ir = String(Math.trunc(Math.abs(res))), nI = Math.max(ia.length, ib.length, ir.length), nD = Math.max(da.length, db.length);
  const cells = (i, d) => { let h = ''; for (let k = 0; k < nI; k++) { const ch = i[i.length - nI + k] || ''; h += `<td>${ch}</td>`; }
    if (nD) { h += `<td class="cm">${d ? ',' : ''}</td>`; for (let k = 0; k < nD; k++) h += `<td>${d ? d[k] || '' : ''}</td>`; } return h; };
  const blank = cls => `<tr class="${cls}"><td class="op"></td>${cells('', '')}</tr>`;
  return `<div class="colop num"><table class="colg" role="img" aria-label="${esc(a)} ${op === '+' ? 'més' : 'menys'} ${esc(b)}">${blank('cr')}
    <tr><td class="op"></td>${cells(ia, da)}</tr><tr class="l2"><td class="op">${op}</td>${cells(ib, db)}</tr>${blank('ans')}</table></div>`;
}
function opPair(r, curs, op, carry){
  const D = curs <= 1 ? 1 : Math.min(curs, 4), lo = D === 1 ? 1 : 10 ** (D - 1), hi = 10 ** D - 1;
  for (let k = 0; k < 400; k++) {
    let a = ri(r, lo, hi), b = ri(r, lo, hi);
    if (op === '+') { if (curs === 1) { a = ri(r,1,12); b = ri(r,1,20 - a); return [a,b]; } if (a + b > hi) continue; if (hasCarry(a,b) === carry) return [a,b]; }
    else { if (curs === 1) { a = ri(r,5,20); b = ri(r,1,a - 1); return [a,b]; } if (a < b) [a,b] = [b,a]; if (a === b) continue; if (hasBorrow(a,b) === carry) return [a,b]; }
  }
  return op === '+' ? [12,7] : [19,6];
}
const HORES = ['dotze','una','dues','tres','quatre','cinc','sis','set','vuit','nou','deu','onze','dotze'];
function horaText(h, m){
  const n = h % 12 + 1, de = x => (x === 1 || x === 11) ? "d'" + HORES[x] : 'de ' + HORES[x];
  if (m === 0) return (h === 1 ? 'La una' : 'Les ' + HORES[h]) + ' en punt';
  return ['','Un quart','Dos quarts','Tres quarts'][m / 15] + ' ' + de(n);
}
function clockSVG(h, m){
  let nums = '';
  for (let i = 1; i <= 12; i++) { const a = i * Math.PI / 6; nums += `<text x="${(100 + 72 * Math.sin(a)).toFixed(1)}" y="${(100 - 72 * Math.cos(a) + 7).toFixed(1)}" text-anchor="middle" font-size="19" font-weight="700" fill="var(--ink)" font-family="Andika, sans-serif">${i}</text>`; }
  const ma = m * 6 * Math.PI / 180, ha = ((h % 12) * 30 + m * 0.5) * Math.PI / 180;
  return `<svg class="clock" viewBox="0 0 200 200" role="img" aria-label="Rellotge"><circle cx="100" cy="100" r="92" fill="var(--card)" stroke="var(--ink)" stroke-width="6"/>${nums}
  <line x1="100" y1="100" x2="${100 + 38 * Math.sin(ha)}" y2="${100 - 38 * Math.cos(ha)}" stroke="var(--ink)" stroke-width="9" stroke-linecap="round"/>
  <line x1="100" y1="100" x2="${100 + 52 * Math.sin(ma)}" y2="${100 - 52 * Math.cos(ma)}" stroke="var(--brand)" stroke-width="5" stroke-linecap="round"/><circle cx="100" cy="100" r="7" fill="var(--ink)"/></svg>`;
}
function moneySVG(list){
  return '<div class="row" style="justify-content:center">' + list.map(v => {
    if (v >= 5) return `<svg width="96" height="54" viewBox="0 0 96 54" role="img" aria-label="${v} euros"><rect x="2" y="2" width="92" height="50" rx="6" fill="${v === 5 ? '#c9c2b8' : v === 10 ? '#e6a2a2' : '#9ec3e6'}" stroke="#5a5a5a" stroke-width="2"/><text x="48" y="35" text-anchor="middle" font-size="22" font-weight="700" fill="#1c2747" font-family="Andika, sans-serif">${v} €</text></svg>`;
    const big = v >= 1, lab = big ? v + ' €' : Math.round(v * 100) + ' c';
    const fill = v === 2 ? '#d9d9d9' : v === 1 ? '#e8c95a' : v >= 0.1 ? '#e8c95a' : '#c98a52';
    return `<svg width="58" height="58" viewBox="0 0 58 58" role="img" aria-label="${lab}"><circle cx="29" cy="29" r="26" fill="${fill}" stroke="#8a6d1e" stroke-width="3"/>${big ? '<circle cx="29" cy="29" r="17" fill="' + (v === 2 ? '#e8c95a' : '#d9d9d9') + '"/>' : ''}<text x="29" y="35" text-anchor="middle" font-size="15" font-weight="700" fill="#1c2747" font-family="Andika, sans-serif">${lab}</text></svg>`;
  }).join('') + '</div>';
}
function fracSVG(n, d){
  let s = '';
  for (let i = 0; i < d; i++) {
    const a0 = i / d * 2 * Math.PI - Math.PI / 2, a1 = (i + 1) / d * 2 * Math.PI - Math.PI / 2;
    s += `<path d="M100 100 L${(100 + 80 * Math.cos(a0)).toFixed(2)} ${(100 + 80 * Math.sin(a0)).toFixed(2)} A80 80 0 0 1 ${(100 + 80 * Math.cos(a1)).toFixed(2)} ${(100 + 80 * Math.sin(a1)).toFixed(2)} Z" fill="${i < n ? 'var(--mat)' : 'var(--card)'}" stroke="var(--ink)" stroke-width="3"/>`;
  }
  return `<svg class="clock" viewBox="0 0 200 200" role="img" aria-label="Fracció">${s}</svg>`;
}

function bankParse(sp, text){
  const out = [], lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
  lines.forEach((l, n) => {
    const err = m => { throw new Error(`Línia ${n+1}: ${m}`); };
    if (sp.f === 'w') { if (sp.k.startsWith('regles.') && !/^[^\[\]]*\[[^\[\]]+\][^\[\]]*$/.test(l)) err('falten els [ ]'); out.push(l); return; }
    if (sp.f === 'lw') { const w = l.split(',').map(x=>x.trim()).filter(Boolean); if (w.length < 3) err('posa almenys 3 paraules'); out.push(w); return; }
    const p = l.split('|').map(x=>x.trim());

  });
  if (!out.length) throw new Error('El banc no pot quedar buit.');
  return out;
}

const coopOf = cid => { S.coop = S.coop || {}; return S.coop[cid] = S.coop[cid] || {goal: studentsOf(cid).length * 40, wins:[]}; };
function coopState(cid){ const c = coopOf(cid), ws = weekStart(), ids = new Set(studentsOf(cid).map(x=>x.id)), n = S.att.filter(a => ids.has(a.sid) && a.ts >= ws).length;
  if (n >= c.goal && !c.wins.includes(ws)) { c.wins.push(ws); for (const s of studentsOf(cid)) if (!s.m.own.includes('fons:classe')) s.m.own.push('fons:classe'); save(); }
  return {goal:c.goal, n, done:n >= c.goal, wins:c.wins.length}; }
function coopCard(cid, teacher){

function rapidQ(c){
  const r = Math.random, t = ri(r, 0, 3);
  if (c === 1) { if (t < 2) { const a = ri(r,1,9), b = ri(r,1,10 - a); return [`${a} + ${b}`, a + b]; } const a = ri(r,3,10), b = ri(r,1,a); return [`${a} − ${b}`, a - b]; }
  if (c === 2) { if (t === 0) { const a = ri(r,2,10); return [`${a} + ${a}`, 2*a]; } if (t === 1) { const a = ri(r,5,20), b = ri(r,1,a); return [`${a} − ${b}`, a - b]; } const a = ri(r,1,10), b = ri(r,1,10); return [`${a} + ${b}`, a + b]; }
  if (c === 3) { if (t < 2) { const a = pick(r,[2,3,4,5,10]), b = ri(r,1,10); return [`${a} × ${b}`, a*b]; } const a = ri(r,1,9)*10, b = ri(r,1,9)*10; return t === 2 ? [`${a} + ${b}`, a + b] : [`${Math.max(a,b)} − ${Math.min(a,b)}`, Math.abs(a - b)]; }
  if (t < 2) { const a = ri(r,2,9), b = ri(r,2,10); return [`${a} × ${b}`, a*b]; }
  if (t === 2) { const b = ri(r,2,9), q = ri(r,2,10); return [`${b*q} : ${b}`, q]; }
  if (c >= 5) { const a = ri(r,2,99), k = pick(r,[10,100]); return [`${a} × ${k}`, a*k]; }
  const a = ri(r,11,60), b = ri(r,11,39); return [`${a} + ${b}`, a + b];
}

function classStats(c){

  const att = S.att.filter(a => ids.has(a.sid) && a.ts >= now() - 14 * DAY);
  const active = sts.filter(s => S.att.some(a => a.sid === s.id && a.ts >= now() - 7 * DAY)).length;
  const rev = S.review.filter(x => ids.has(x.sid)).length;
  return {sts, tasks, assigned, done, acc:acc(att), active, rev};
}
function studentRow(s, tasks){

    <td class="num">${reviewsDue(s.id).length}</td><td>${chip}</td></tr>`, tsv:[s.nom, done + '/' + mine.length, v == null ? '' : Math.round(v*100), days.reduce((a,b)=>a+b,0), S.review.filter(x=>x.sid===s.id).length].join('\t')};
}
function alertsFor(c){

  const inact = sts.filter(s => !s.paper).filter(s => { const last = S.att.filter(a=>a.sid===s.id).reduce((m,a)=>Math.max(m,a.ts),0); return !last || now() - last >= 5 * DAY; });

      if (last.length >= 5 && wrong >= 4 && SKM(k).gen) out.push({k:'bad', t:`${esc(s.nom)} s'encalla a «${esc(SKM(k).nom)}»: ${wrong} errors en els últims 5 exercicis.`, act:`<button class="btn ghost small" data-a="reforc" data-v="${k}" data-s="${s.id}">Crea-li un reforç</button>`}); } }

  return out;
}

    const keep = document.createElement('div'); keep.className = 'pkeep'; g.insertBefore(keep, b); keep.appendChild(b);

}

function famActs(s){
  const by = {}; for (const a of attOf(s.id, 30)) { const b = blocOf(a.skill); (by[b] = by[b] || []).push(a); }
  const ranked = Object.entries(by).filter(([b,l]) => l.length >= 3 && FAMACT[b]).sort((x,y) => acc(x[1]) - acc(y[1])).map(([b]) => b);

}

  let target = 'all'; if (!classId || classId === d.classId) { if (d.target === 'sel') target = d.sel.slice(); else if (d.target.startsWith('g:')) target = (S.groups.find(g=>g.id===d.target.slice(2))?.sids || []).slice(); }
  const due = d.due ? new Date(d.due + 'T18:00').getTime() : now() + 7 * DAY, start = d.start ? new Date(d.start + 'T00:00').getTime() : now();
  return {id:'t'+uid(), title:d.title.trim() || (d.diag ? 'Prova inicial de ' + CURS[c.curs] : 'Tasca del ' + fmtDate(now())), classId:c.id, target, items:{...d.items}, custom:d.custom.slice(), same:d.same, seed:Math.floor(Math.random()*1e9), created:now(), start: start > now() ? start : undefined, due, from:'docent', diag:!!d.diag, exam:!!d.exam, time: d.exam ? Math.max(0, Math.min(120, +d.time || 0)) : 0};
}
function draftTasks(){
  const d = R.draft, lot = d.lines.length ? 'lot' + uid() : null, out = [], weeks = d.repeat ? Math.max(2, Math.min(12, +d.weeks || 4)) : 1;
  for (const cid of [d.classId, ...d.lines]) for (let w = 0; w < weeks; w++) { const t = draftToTask(cid);
    if (w) { t.id = 't' + uid(); t.seed = Math.floor(Math.random()*1e9); t.start = (t.start || now()) + w * 7 * DAY; t.due += w * 7 * DAY; t.title += ` (setmana ${w+1})`; } else if (d.repeat) t.title += ' (setmana 1)';
    if (lot) t.lot = lot + (weeks > 1 ? '-' + w : ''); out.push(t); }
  return out;
}
function genFresh(id, curs, r, avoid){ let ex; for (let k = 0; k < 15; k++) { ex = genEx(id, curs, r); if (!avoid.has(exKey(ex))) return ex; } return ex; }
/* en paper, dos exercicis són el mateix si es veuen igual (encara que les opcions vinguin en un altre ordre) */
const paperKey = e => { if (e.skill === 'c-comprensio' || e.skill === 'c-oral') return String(hashStr(JSON.stringify(['comp', e.prompt, e.options && e.options.map(String).sort()]))); const gap = /class="gap"/.test(e.visual || ''); return String(hashStr(JSON.stringify([gap ? 'gap' : e.skill, gap ? '' : e.prompt, String(e.visual || '').replace(/\s+/g, ' '), gap ? '' : e.options && e.options.map(String).sort(), e.items && e.items.map(x => typeof x === 'object' ? x.t : x).sort(), e.pairs && e.pairs.map(String).sort(), e.type === 'dictat' ? e.answer : '', e.listen || '']))); };
const FCAPS = {};
function fCap(id, c){ const sk = SKM(id); if (!sk || !sk.gen || c < sk.min || c > sk.max) return 0; const k = id + c; if (!(k in FCAPS)) { const set = new Set(), r = mulberry(4242 + c); let vis = false;
  for (let i = 0; i < 600; i++) { const e = genEx(id, c, r); set.add(paperKey(e)); if (e.type === 'classifica' || e.type === 'relaciona') vis = true; if (set.size >= 20 && i > 300) break; }
  let cap = Math.min(20, set.size);
  // classificar i relacionar: tants apartats com el generador pugui fer sense repetir cap paraula ni frase (es simula)
  if (vis) { const g = GP.like, f = GP.figs; GP.like = null; GP.figs = null; let best = 20;
    for (const sd of [11, 29]) { const rr = mulberry(sd * 977 + c), own = new Set(), used = new Set(); let n = 0;
      for (; n < cap; n++) { const e = genPaper(id, c, rr, own, null, used); const tk = e.type === 'classifica' ? (e.items.every(x => isNum(x.t)) ? [] : toks(e.items.map(x => x.t))) : e.type === 'relaciona' ? toks(e.pairs.flat()) : [];
        if (own.has(paperKey(e)) || tk.some(w => used.has(w))) break; own.add(paperKey(e)); tk.forEach(w => used.add(w)); exWords(e).forEach(w => used.add(w)); }
      best = Math.min(best, n); }
    GP.like = g; GP.figs = f; cap = Math.max(1, Math.min(cap, best)); }
  FCAPS[k] = cap; } return FCAPS[k]; }
function genPaper(id, curs, r, avoid, prefer, words){ let best = null, bs = 1e9;
  for (let k = 0; k < 320; k++) { const ex = genEx(id, curs, r), pk = paperKey(ex); if (avoid.has(pk)) continue;
    const ws = words ? exWords(ex) : [], ov = ws.filter(w => !w.startsWith('q:') && words.has(w)).length, oq = ws.some(w => w.startsWith('q:') && words.has(w)) ? 1 : 0;
    const sc = ov * 20 + (paperOk(ex) ? 0 : 50) + (paperLike(ex) ? 0 : 8) + (prefer && prefer.has(pk) ? 4 : 0) + oq;
    if (sc === 0) return ex; if (sc < bs) { bs = sc; best = ex; } }
  if (best) return best; let ex; for (let k = 0; k < 4000; k++) { ex = genEx(id, curs, r); if (!avoid.has(paperKey(ex))) return ex; } return ex; }
// en paper, cap columna de classificar buida
const GP = {like: null, figs: null};
const shapeK = ex => ex.type === 'relaciona' ? 'rel:' + toks(ex.pairs.flat()).join('|') : shapeK0(ex);
const shapeK0 = ex => /class="shape/.test(ex.visual || '') ? String(ex.visual) : /class="chart"/.test(ex.visual || '') ? 'chart:' + (ex.skill === 'm-sectors' ? ex.prompt.split(':')[0] : ((String(ex.visual).match(/aria-label="([^"]+)"/) || [])[1] || '')).replace("de l'escola", 'de la classe') : '';
const paperLike = ex => (!GP.like || GP.like.type !== ex.type || !GP.like.options || !ex.options || GP.like.options.length === ex.options.length) && (!GP.figs || (ex.type === 'relaciona' || ex.type === 'classifica' ? !toks(ex.type === 'relaciona' ? ex.pairs.flat() : ex.items.map(x => x.t)).some(w => GP.figs.has('w:' + w)) : !shapeK(ex) || !GP.figs.has(shapeK(ex))));
const stemOk = ex => ex.skill !== 'c-temps' || new Set(ex.items.map(x => x.t.split(' ').pop().slice(0, 4))).size === ex.items.length;
const hlOk = ex => { const h = ex.items.map(x => (String(x.t).match(/\*([^*]+)\*/) || [])[1]).filter(Boolean).map(w => w.toLowerCase()); return new Set(h).size === h.length; };
const balOk = ex => ex.items.length < 6 || ex.buckets.length > 2 || ex.buckets.every((b, bi) => ex.items.filter(x => x.b === bi).length >= 2);
const AMBIG = [['gros','gran'],['prim','petit'],['alt','llarg'],['baix','curt'],['content','alegre'],['trist','enfadat']];
const paperOk = ex => ex.type === 'relaciona' ? new Set(ex.pairs.flat().map(x => String(x).toLowerCase())).size === ex.pairs.length * 2 && !AMBIG.some(([a, b]) => { const f = ex.pairs.flat().map(x => String(x).toLowerCase()); return f.includes(a) && f.includes(b); }) : ex.type !== 'classifica' || stemOk(ex) && hlOk(ex) && balOk(ex) && (ex.buckets.every((b, bi) => ex.items.some(x => x.b === bi)) && new Set(ex.items.map(x => x.t)).size === ex.items.length);
// paraules d'un exercici, per no repetir-les entre els apartats d'un mateix grup
const normA = t => String(t).toLowerCase().trim().replace(/^(a|al|als|en|a la|a les|a l'|el|la|els|les|l'|un|una|uns|unes)\s*/,'').replace(/[.!?]$/, '');
const toks = a => a.flatMap(t => { t = String(t).replace(/\*/g, '').toLowerCase().trim().replace(/^(\d+) × (\d+)$/, (m, x, y) => [x, y].sort().join(' × ')); return [t, ...(/\s/.test(t) && t.split(' ').length <= 3 ? t.split(/[^a-zà-ÿ·']+/).filter(w => w.length >= 5) : [])]; }).filter(w => w && !/^\d+$/.test(w));
const exWords = ex => [ex.prompt && !/^(Quant fa\?|Calcula)/.test(ex.prompt) ? 'q:' + ex.prompt : '', /<svg/.test(ex.visual || '') && !/class="chart"/.test(ex.visual || '') ? 'v:' + hashStr(String(ex.visual)) : '', ...(String(ex.prompt || '').match(/\d+(?= ?%)/g) || []).map(n => 'pc:' + n), ...(ex.type === 'classifica' ? toks(ex.items.map(x => x.t)) : ex.type === 'relaciona' ? toks(ex.pairs.flat()) : (ex.type === 'tria' && ex.options) ? ['=' + normA(ex.options[ex.answer])] : ex.type === 'escriu' ? ['=' + normA(ex.answer), ...(String(ex.prompt).match(/\d[\d.,]*/g) || []).map(n => 'n:' + n.replace(/[.,]/g, '').replace(/0+$/, '')).filter(n => n.length > 3)] : ex.type === 'ordena' ? [ex.items.join(' ')] : [])].filter(Boolean);
function taskExercises(t, sid){
  const c = cls(t.classId), st = stu(sid), r = mulberry(t.seed + (t.same ? 0 : hashStr(sid))), out = [], seen = new Set(t.same ? [] : (S.seen && S.seen[sid]) || []);
  for (const [id, n0] of Object.entries(t.items)) { const n = st && st.adapt && st.adapt.menys && !t.diag ? Math.max(1, Math.ceil(n0 * .6)) : n0, cc = st ? cursFor(st, SKM(id).mat) : c.curs;
    for (let k = 0; k < n; k++) { const ex = genFresh(id, cc, r, seen); seen.add(exKey(ex)); out.push(ex); } }
  return out.concat(t.custom.map(e => JSON.parse(JSON.stringify(e))));
}
